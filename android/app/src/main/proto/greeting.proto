syntax = "proto3";

package commander.v1;
option java_package = "edu.csci4420.commander.proto";
option java_multiple_files = true;

// The Android app and Java server both generate their code from this file.
service Greeter {
  rpc SayHello(HelloRequest) returns (HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
