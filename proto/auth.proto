syntax = "proto3";

package commander.v1;

option java_package = "edu.csci4420.commander.proto";
option java_multiple_files = true;

service AuthService {
  rpc Register(RegisterRequest) returns (AuthReply);
  rpc Login(LoginRequest) returns (AuthReply);
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message PlayerProfile {
  string player_id = 1;
  string username = 2;
}

// Successful registration also signs the player in.
message AuthReply {
  PlayerProfile player = 1;
  string session_token = 2;
  // Seconds since January 1, 1970, at 00:00 UTC.
  int64 expires_at_unix_seconds = 3;
}
