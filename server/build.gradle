plugins {
    id 'application'
    id 'com.google.protobuf' version '0.9.4'
}

repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

def grpcVersion = '1.71.0'
dependencies {
    implementation platform("io.grpc:grpc-bom:${grpcVersion}")
    implementation 'io.grpc:grpc-netty-shaded'
    implementation 'io.grpc:grpc-protobuf'
    implementation 'io.grpc:grpc-stub'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    testImplementation 'junit:junit:4.13.2'
}

sourceSets.main.proto.srcDirs = ['../proto']
protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:3.25.5' }
    plugins { grpc { artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}" } }
    generateProtoTasks { all().configureEach { plugins { grpc {} } } }
}

application { mainClass = 'edu.csci4420.commander.GreetingServer' }
tasks.register('greet', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'edu.csci4420.commander.GreetingClient'
    args((findProperty('host') ?: 'localhost').toString(),
         (findProperty('port') ?: '50051').toString(),
         (findProperty('name') ?: 'Android').toString())
}
