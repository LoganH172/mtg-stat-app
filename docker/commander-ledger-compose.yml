services:
  commander-ledger:
    image: commander-ledger:latest
    deploy:
        replicas: 2
    ports:
        - 50051:50051
    networks:
        - db-network

  mysql-1:
    image: mysql:8.4
    deploy:
        replicas: 1
    networks:
        - db-network
    volumes:
        - db-vol-1:/var/lib/mysql
        - ./commanderDBInit.sql:/docker-entrypoint-initdb.d/commanderDBInit.sql
    environment:
        - MYSQL_ROOT_PASSWORD=mysqlPassword

  mysql-2:
    image: mysql:8.4
    deploy:
        replicas: 1
    networks:
        - db-network
    volumes:
        - db-vol-2:/var/lib/mysql
        - ./commanderDBInit.sql:/docker-entrypoint-initdb.d/commanderDBInit.sql
    environment:
        - MYSQL_ROOT_PASSWORD=mysqlPassword      

volumes:
    db-vol-1:
    db-vol-2:
  
networks:
    db-network:
        driver: overlay
        internal: true
        
